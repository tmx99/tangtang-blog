<h1>五一平谷桃花海</h1>
<div class="meta">发布时间：2013-05-03 &nbsp;|&nbsp; 分类：走走看看 &nbsp;|&nbsp; 原文：<a href="https://blog.sina.com.cn/s/blog_5380048c0101cv18.html" target="_blank">https://blog.sina.com.cn/s/blog_5380048c0101cv18.html</a></div>
<div class="content">
<p align="center"><img name="image_operate_44821367506126515" src="../images/044_cb96fbc827.jpg" real_src="../images/044_cb96fbc827.jpg" width="690" height="517" alt="五一平谷桃花海" title="五一平谷桃花海"></p>
<p align="center">雕窝村，号称平谷的三里屯，但是现在已经十分商业化，难以找到艺术气息了。雕窝的农家院开门见山，紧邻石林峡和黄松峪水库，景色倒是很美</p>

<p align="center"><img name="image_operate_58691367549033218" src="../images/044_f81ab8f49c.jpg" real_src="../images/044_f81ab8f49c.jpg" width="690" height="517" alt="五一平谷桃花海" title="五一平谷桃花海"></p>
<p align="center">金海湖，曼曼体验了滑索速降和快艇</p>

<p align="center"><a href="http://photo.blog.sina.com.cn/showpic.html#blogid=5380048c0101cv18&amp;url=http://s3.sinaimg.cn/orignal/5380048ctdbc7319157d2" target="_blank"></a><img name="image_operate_28111367549234171" src="../images/044_998e0f0ece.jpg" real_src="../images/044_998e0f0ece.jpg" alt="五一平谷桃花海" title="五一平谷桃花海"><br>
因为堵车，从北京到雕窝开了六个半小时，也没有去观景台体验从高处俯视桃花海的感觉。平谷之行，最美的是顺平路、平蓟路、金海湖路边的桃花海。只是我的照相技术太差，照不出桃花海的感觉。</p>
